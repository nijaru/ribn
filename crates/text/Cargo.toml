[package]
name = "ribn-text"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cuda = ["dep:engine-qwen", "engine-qwen/cuda"]
metal = ["engine-gemma4/metal"]

[dependencies]
ribn = { path = "../runtime" }
engine-gguf = { path = "../gguf" }
engine-gemma4 = { path = "../gemma4" }
ribn-hf = { path = "../hf" }
engine-qwen = { path = "../qwen", optional = true }
flume = { version = "0.12", default-features = false, features = ["async"] }

[dev-dependencies]
serde_json = "1.0.149"

[[example]]
name = "concurrent_text"
required-features = ["cuda"]

[lints]
workspace = true
