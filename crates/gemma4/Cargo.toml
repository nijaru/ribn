[package]
name = "engine-gemma4"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ribn-hf = { path = "../hf" }
ribn-safetensors = { path = "../safetensors" }
ribn-foundation = { path = "../foundation" }
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
minijinja = { version = "2.24.0", features = ["fuel", "json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
sha2 = "0.10.9"

[lints]
workspace = true
