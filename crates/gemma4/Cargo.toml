[package]
name = "engine-gemma4"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cuda = ["dep:engine-core", "dep:engine-nvidia", "engine-nvidia/cuda", "dep:cudarc"]

[dependencies]
engine-core = { path = "../core", optional = true }
engine-nvidia = { path = "../nvidia", optional = true }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "cuda-13020", "dynamic-loading"] }
ribn-hf = { path = "../hf" }
ribn-safetensors = { path = "../safetensors" }
ribn-foundation = { path = "../foundation" }
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
minijinja = { version = "2.24.0", features = ["fuel", "json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
sha2 = "0.10.9"

[[example]]
name = "cuda_weights"
required-features = ["cuda"]

[lints]
workspace = true
