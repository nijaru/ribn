name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p engine-qwen --no-default-features --test model_config --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  benchmark-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.x', '3.14', '3.13', '3.12', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: benchmarks/requirements-host.txt
      - run: python3 -m pip install -r benchmarks/requirements-host.txt
      - run: python3 tools/check-boundaries.py
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
  cuda-feature-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - run: cargo clippy -p engine-nvidia --features cuda --all-targets --locked -- -D warnings
      - run: cargo clippy -p ribn-text --features cuda --all-targets --locked -- -D warnings
      - run: cargo clippy -p ribn-cli --features cuda --all-targets --locked -- -D warnings
      - run: cargo clippy -p engine-qwen --features cuda --all-targets --locked -- -D warnings
      - run: cargo test -p engine-nvidia --features cuda --lib --locked
      - run: cargo test -p engine-bert --features cuda --locked
      - run: cargo test -p engine-qwen --features cuda --locked
      - run: cargo test -p engine-qwen --features cuda --example qwen_serving_bench --locked
      - run: cargo test -p ribn-text --features cuda --locked
      - run: cargo test -p ribn-cli --features cuda --locked
